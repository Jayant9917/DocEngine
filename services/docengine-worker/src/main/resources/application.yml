spring:
  application:
    name: docengine-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docengine}
    username: ${SPRING_DATASOURCE_USERNAME:docengine}
    password: ${SPRING_DATASOURCE_PASSWORD:docengine-local-password}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:docengine}
    password: ${SPRING_RABBITMQ_PASSWORD:docengine-local-password}

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      access: unrestricted

docengine:
  worker:
    lease-seconds: ${DOCENGINE_WORKER_LEASE_SECONDS:300}
  storage:
    provider: ${DOCENGINE_STORAGE_PROVIDER:minio}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:docengine}
    secret-key: ${MINIO_SECRET_KEY:docengine-local-password}
    input-bucket: ${DOCENGINE_STORAGE_INPUT_BUCKET:${MINIO_INPUT_BUCKET:docengine-inputs}}
    result-bucket: ${DOCENGINE_STORAGE_RESULT_BUCKET:${MINIO_RESULT_BUCKET:docengine-results}}
    s3:
      region: ${DOCENGINE_STORAGE_S3_REGION:ap-south-1}
      input-prefix: ${DOCENGINE_STORAGE_S3_INPUT_PREFIX:inputs}
      output-prefix: ${DOCENGINE_STORAGE_S3_OUTPUT_PREFIX:outputs}
